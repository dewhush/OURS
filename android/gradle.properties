org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional Firebase (wake-up push). Leave empty to build without push.
# Fill from the Firebase console (Project settings > General > Your apps).
ours.firebase.appId=
ours.firebase.apiKey=
ours.firebase.projectId=
ours.firebase.senderId=
# Server URL prefilled in onboarding (debug builds). Can be changed in the app.
ours.defaultServerUrl=

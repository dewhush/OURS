<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0066CC" />
  <title>OURS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="splash" class="splash-overlay" aria-hidden="false">
    <div class="splash-card">
      <svg class="splash-rings" viewBox="0 0 120 76" width="120" height="76" aria-hidden="true">
        <circle class="ring ring-left" cx="44" cy="38" r="24" fill="none" stroke="currentColor" stroke-width="5.5" />
        <circle class="ring ring-right" cx="76" cy="38" r="24" fill="none" stroke="currentColor" stroke-width="5.5" />
      </svg>
      <div class="splash-title">OURS</div>
      <div class="splash-badge">PRIVATE SPACE FOR TWO</div>
    </div>
  </div>

  <div id="app" class="app-shell hidden"></div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OURS Atomic Components (Slice 3A)</title>
  <link rel="preload" href="/fonts/Inter-VF.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/GeistMono-VF.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/components.css" />
  <script src="/components.js" defer></script>
  <script src="/components-preview.js" defer></script>
</head>
<body class="tp-body">
  <header class="tp-header">
    <div class="tp-header-inner">
      <div>
        <h1>OURS Atomic Components (Wave 3A)</h1>
        <p class="tp-subtitle">Buttons, Inputs, Chips, Avatars &amp; Badges across 4 states</p>
      </div>
      <div class="tp-theme-controls" role="group" aria-label="Theme mode">
        <button type="button" id="cp-theme-light" class="tp-theme-btn" aria-pressed="true">Light</button>
        <button type="button" id="cp-theme-dark" class="tp-theme-btn" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>

  <main class="cp-main">
    <section id="comp-buttons" class="cp-section" aria-labelledby="h-buttons">
      <h2 id="h-buttons">1. Buttons (.ours-btn)</h2>
      <div id="grid-buttons" class="cp-grid"></div>
    </section>

    <section id="comp-inputs" class="cp-section" aria-labelledby="h-inputs">
      <h2 id="h-inputs">2. Inputs (.ours-input)</h2>
      <div id="grid-inputs" class="cp-grid"></div>
    </section>

    <section id="comp-chips" class="cp-section" aria-labelledby="h-chips">
      <h2 id="h-chips">3. Chips (.ours-chip)</h2>
      <div id="grid-chips" class="cp-grid"></div>
    </section>

    <section id="comp-avatars" class="cp-section" aria-labelledby="h-avatars">
      <h2 id="h-avatars">4. Avatars (.ours-avatar)</h2>
      <div id="grid-avatars" class="cp-grid"></div>
    </section>

    <section id="comp-badges" class="cp-section" aria-labelledby="h-badges">
      <h2 id="h-badges">5. Badges (.ours-badge)</h2>
      <div id="grid-badges" class="cp-grid"></div>
    </section>
  </main>
</body>
</html>

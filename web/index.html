<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F5" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090B10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OURS</title>
  <link rel="preload" href="/fonts/Inter-VF.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/GeistMono-VF.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js" crossorigin="anonymous" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="splash" class="splash-overlay" role="status" aria-label="OURS Loading">
    <div class="ambient-orbs" aria-hidden="true">
      <span class="ambient-orb orb-top"></span>
      <span class="ambient-orb orb-mid"></span>
      <span class="ambient-orb orb-bot"></span>
    </div>
    <div class="splash-stage">
      <div class="splash-squircle">
        <svg class="splash-rings" viewBox="0 0 100 100" width="76" height="76" aria-hidden="true">
          <circle class="splash-ring-left" cx="39" cy="50" r="18" />
          <circle class="splash-ring-right" cx="61" cy="50" r="18" />
          <path class="splash-weave-cut" d="M42.7 32.4C48.122 33.552 52.711 37.137 55.14 42.12" />
          <path class="splash-weave-left" d="M42.7 32.4C48.122 33.552 52.711 37.137 55.14 42.12" />
          <path class="splash-weave-cut" d="M57.24 67.62C51.818 66.468 47.229 62.883 44.8 57.9" />
          <path class="splash-weave-right" d="M57.24 67.62C51.818 66.468 47.229 62.883 44.8 57.9" />
        </svg>
      </div>
      <div class="splash-wordmark">
        <span class="splash-title">OURS</span>
        <span class="splash-rule" aria-hidden="true"></span>
        <span class="splash-subtitle" id="splash-sub">Private for two</span>
      </div>
    </div>
    <div class="splash-bottom-pill" aria-hidden="true"></div>
  </div>
  <div id="app" class="app-shell hidden"></div>
  <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>
</body>
</html>
